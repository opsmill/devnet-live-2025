[project]
name = "devnet-live-2025"
version = "0.1.0"
description = "Example project for the DevNet Live session on how to build a production-grade automation platform with Infrahub"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "infrahub-sdk[all]==1.12.1",
]

[dependency-groups]
dev = [
    "infrahub-testcontainers>=1.2.10",
    "pytest-asyncio>=0.26.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]